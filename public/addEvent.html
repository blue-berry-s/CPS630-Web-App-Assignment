<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Event</title>
    <link rel="stylesheet" href="./css/defaultStyle.css">
    <link rel="stylesheet" href="./css/addEventStyle.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kite+One&family=Pacifico&family=Stack+Sans+Notch&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Zen+Dots&display=swap');
    </style>
</head>
<body>
    <header id="nav-bar">
      <div id="left-icons">
        <img src="./assets/logos/TMU.jpg" alt="TMU Logo">
        <h1>TMU EVENTS</h1>
      </div>

      <nav id="right-icons">
        <img src="./assets/icons/home.svg" alt="Home Button">
        <img src="./assets/icons/profile.svg" alt="Profile Button">
      </nav>
    </header>

  <section id="topText">
    <h1> Add an Event! </h1>
    <p> Description text here </p>
  </section>

  <form>
    <h1> NEW EVENT FORM </h1>
    <div class="row">
        <div class="inputSection">
          <label for="eventName"> Event Name</label>
          <input type="text" name="eventName" placeholder="Event Name">
        </div>

        <div class="inputSection">
          <label for="eventDate"> Date</label>
          <input type="date" name="eventDate">
        </div>
    </div>

    <div class="inputSection">
      <label for="eventDesc"> Event Description</label>
      <textarea id="eventDescInput" name="eventDesc" rows="5"  placeholder="Write a short description of your event here"></textarea>
    </div>

    <h2> Event Tags</h2>
    
    <div>
        <div class="selector">
          <input type="checkbox" name="academicsTag" id="academicsTag" />
          <label for="academicsTag">Academics</label>
        </div>
    </div>

    <h2> Event Details</h2>
        <div class="grid" id="eventGrid">
            <div>
              <label for="locationData"> <img src="./assets/icons/LocationIcon.svg"></label>
              <input type="text" name="locationData" placeholder="Location">
            </div>

            <div>
              <label for="timeData"> <img src="./assets/icons/TimeIcon.svg" style="width:2em; height:2em;"></label>
              <input type="text" name="timeData" placeholder="Time">
            </div>

            <div>
              <label for="creatorData"> <img src="./assets/icons/CreatorIcon.svg" style="width:2em; height:2em;"></label>
              <input type="text" name="creatorData" placeholder="Event For">
            </div>

            <div>
              <label for="availabilityData"> <img src="./assets/icons/AvailabilityIcon.svg"></label>
              <input type="number" name="availabilityData" placeholder="Number of seats">
            </div>

            <div>
              <label for="priceData"> <img src="./assets/icons/PriceIcon.svg"></label>
              <input type="number" name="priceData" placeholder="Price">
            </div>

            <div>
              <label for="imageData"> <img src="./assets/icons/ImageIcon.svg" style="width:1.3em; height:1.3em;"></label> 
              <input type="file" accept="image/png, image/jpg, image/svg">
            
            </div>
        </div>

        
    <h2> Registration Details</h2>

        <div class="gid" id="registrationGrid">
          <div class="div1"><h3> Requires Registration?</h3></div>
          <div class="selector div2">
            <input type="radio" id="registrationTrue" name="requiresRegistration" value="registrationTrue" checked />
            <label for="registrationTrue"> Yes </label>
          </div>
          <div class="selector div3">
            <input type="radio" id="registrationFalse" name="requiresRegistration" value="registrationFalse" />
            <label for="registrationTrue"> No </label>
          </div>
          

          <div class="div4"><h3> Registration Opens</h3></div>
          <div class="selector div5">
            <input type="radio" id="dateToday" name="registrationDate" value="dateToday" checked />
            <label for="registrationTrue"> Today </label>
          </div>
          <div class="selector div6">
            <input type="radio" id="dateOther" name="registrationDate" value="dateOther" />
            <label for="registrationTrue">  <input type="date" id="registrationDateDate"> </label>
          </div>
            


          <div class="div7"><h3> Registration Link</h3></div>
          <div class="div8"><input type="text" name="registrationLink" placeholder="Registration Link"></div>
        </div>

        <input type="submit">

  </form>
  
    
</body>
</html>
