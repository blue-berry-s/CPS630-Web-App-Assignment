<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/defaultStyle.css">
  <link rel="stylesheet" href="css/loginStyle.css" />
</head>

<body class="flex justify-center items-start">

  <div class="login-card flex flex-col items-start">

    <img
      src="./assets/logos/TMU.jpg"
      alt="TMU Logo"
      class="logo mb-10 object-contain"
    />

    <form id="loginForm" method="POST" action="/" class="flex flex-col items-center space-y-5 w-full">

      <div class="input-box flex flex-col p-4 rounded-lg space-y-4">

        <input
          id="email"
          name="email"
          type="email"
          placeholder="yourname@torontomu.ca"
          class="input-field"
          required
        />

        <input
          id="password"
          name="password"
          type="password"
          placeholder="********"
          class="input-field"
          required
        />
      </div>

      <p id="error" class="text-red-600 text-sm hidden"></p>

      <div class="flex justify-start w-full px-6">
        <button
          type="submit"
          class="login-btn text-white py-3 rounded-md">
          Log In
        </button>
      </div>
    </form>

    <p class="mt-4 px-6 text-end text-gray-600 text-sm">
      Forgot your password?
      <a href="#" class="text-blue-600 hover:underline">Reset</a>
    </p>

  </div>
</body>
</html>
